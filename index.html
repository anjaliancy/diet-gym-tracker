<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym & Healthy Eating Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    /* Custom scrollbar for modern feel */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Default Workout Split Template based on chat history
    const initialWorkoutData = {
      day1: {
        title: "Day 1: Upper 1 (Push / Horizontal Pull)",
        focus: "Chest, Back, Shoulders & Arms",
        exercises: [
          { name: "Incline DB Bench Press", formCue: "45° elbow tuck, 2-3s lowering tempo", target: "3 sets × 8-10 reps", sets: [{ weight: "7.5", reps: "10" }, { weight: "10", reps: "4" }, { weight: "7.5", reps: "4" }] },
          { name: "Single-Arm DB Rows (Drop Set Friendly)", formCue: "Deep stretch at bottom, elbow to hip", target: "3 sets × 8-10 reps", sets: [{ weight: "10", reps: "10" }, { weight: "12.5", reps: "8" }, { weight: "10", reps: "2" }] },
          { name: "Neutral DB Shoulder Press", formCue: "Palms facing in to protect shoulders", target: "3 sets × 8-10 reps", sets: [{ weight: "5", reps: "10" }, { weight: "7.5", reps: "8" }, { weight: "7.5", reps: "9" }] },
          { name: "Cable/Band Face Pulls", formCue: "Pull rope to forehead, flare elbows high", target: "3 sets × 12-15 reps", sets: [{ weight: "15", reps: "10" }, { weight: "20", reps: "10" }, { weight: "25", reps: "8" }] },
          { name: "DB Bicep Curls (Simultaneous / Alt)", formCue: "Squeeze bicep at top, slow descent", target: "3 sets × 10-12 reps", sets: [{ weight: "5", reps: "10" }, { weight: "7.5", reps: "6" }, { weight: "7.5", reps: "6" }] },
          { name: "Overhead DB Tricep Extension", formCue: "Keep elbows tucked forward", target: "3 sets × 10-12 reps", sets: [{ weight: "7.5", reps: "10" }, { weight: "10", reps: "8" }, { weight: "10", reps: "10" }] },
          { name: "Optional Core: Lying Reverse Crunches / Plank", formCue: "Control hip tuck, drive lower back to pad", target: "2-3 sets to near failure", sets: [{ weight: "BW", reps: "35" }, { weight: "Plank", reps: "101 sec" }] }
        ]
      },
      day2: {
        title: "Day 2: Lower 1 (Quads & Glute Focus)",
        focus: "Quads, Glute Max & Core",
        exercises: [
          { name: "DB Goblet / Barbell Squat", formCue: "Keep chest proud, knee inline with toes", target: "3-4 sets × 6-8 reps", sets: [{ weight: "12", reps: "8" }, { weight: "14", reps: "8" }, { weight: "14", reps: "8" }] },
          { name: "Barbell / DB Hip Thrusts", formCue: "Chin tucked, squeeze glutes hard at peak", target: "3-4 sets × 8-12 reps", sets: [{ weight: "20", reps: "12" }, { weight: "25", reps: "10" }, { weight: "25", reps: "10" }] },
          { name: "Bulgarian Split Squats / Reverse Lunges", formCue: "Slight forward torso lean for glute drive", target: "3 sets × 8-10 reps/leg", sets: [{ weight: "6", reps: "10" }, { weight: "8", reps: "8" }, { weight: "8", reps: "8" }] },
          { name: "Seated or Lying Leg Curls", formCue: "Squeeze hamstrings, 2s slow release", target: "3 sets × 12-15 reps", sets: [{ weight: "20", reps: "12" }, { weight: "25", reps: "12" }, { weight: "25", reps: "10" }] },
          { name: "Plank Shoulder Taps / Deadbugs", formCue: "Keep hips level, pull belly button in", target: "3 sets × 45s or 12 reps", sets: [{ weight: "BW", reps: "45s" }, { weight: "BW", reps: "45s" }] }
        ]
      },
      day3: {
        title: "Day 3: Core, Cardio & Conditioning",
        focus: "Active Recovery & Core Endurance",
        exercises: [
          { name: "Core Circuit 1: Reverse Crunches / Flat Bench Knee Raises", formCue: "Exhale on lift, slow lower", target: "3 sets × 15 reps", sets: [{ weight: "BW", reps: "15" }, { weight: "BW", reps: "15" }, { weight: "BW", reps: "15" }] },
          { name: "Core Circuit 2: Cable Woodchoppers / Rotational Core", formCue: "Pivot hips, brace core through turn", target: "3 sets × 12 reps/side", sets: [{ weight: "7.5", reps: "12" }, { weight: "10", reps: "12" }, { weight: "10", reps: "12" }] },
          { name: "Core Circuit 3: Extended Forearm Plank Hold", formCue: "Squeeze glutes & quads tight", target: "3 sets × 60s max hold", sets: [{ weight: "BW", reps: "60s" }, { weight: "BW", reps: "60s" }] },
          { name: "Zone 2 LISS Cardio: Incline Treadmill Walk", formCue: "Speed 4.0-4.5 km/h, Incline 6-10%", target: "25-30 minutes continuous", sets: [{ weight: "Incline 8%", reps: "25 min" }] },
          { name: "Hip & Thoracic Mobility Flow", formCue: "World's greatest stretch & cat-cow", target: "5-10 minutes", sets: [{ weight: "BW", reps: "10 min" }] }
        ]
      },
      day4: {
        title: "Day 4: Upper 2 (Vertical Pull & Accessories)",
        focus: "Lats, Upper Back & Lateral Delts",
        exercises: [
          { name: "Lat Pulldown / Single-Arm Cable Row", formCue: "Full overhead stretch, drive elbow to rib", target: "3-4 sets × 8-12 reps", sets: [{ weight: "25", reps: "12" }, { weight: "30", reps: "10" }, { weight: "30", reps: "8" }] },
          { name: "Flat DB Bench Press / DB Flyes", formCue: "Soft elbows on flyes, deep chest stretch", target: "3 sets × 10-12 reps", sets: [{ weight: "8", reps: "12" }, { weight: "10", reps: "10" }, { weight: "10", reps: "8" }] },
          { name: "Straight-Arm Lat Sweeps / Cable Pulldowns", formCue: "Lock arms straight, sweep bar to thighs", target: "3 sets × 12-15 reps", sets: [{ weight: "12.5", reps: "15" }, { weight: "15", reps: "12" }, { weight: "15", reps: "12" }] },
          { name: "DB Lateral Raises", formCue: "Lead with elbows, pour the tea motion", target: "3-4 sets × 12-15 reps", sets: [{ weight: "4", reps: "15" }, { weight: "5", reps: "12" }, { weight: "5", reps: "12" }] },
          { name: "Hammer Curls", formCue: "Thumbs up grip, builds forearms & biceps", target: "3 sets × 10-12 reps", sets: [{ weight: "6", reps: "12" }, { weight: "7.5", reps: "10" }, { weight: "7.5", reps: "10" }] }
        ]
      },
      day5: {
        title: "Day 5: Lower 2 (Posterior Chain & Hamstrings)",
        focus: "Hamstrings, Glutes & Lower Back",
        exercises: [
          { name: "DB / Barbell Romanian Deadlifts (RDLs)", formCue: "Push hips back, 2-3s eccentric, flat back", target: "4 sets × 8-10 reps", sets: [{ weight: "12", reps: "10" }, { weight: "14", reps: "10" }, { weight: "16", reps: "8" }, { weight: "16", reps: "8" }] },
          { name: "Leg Press / Hack Squat", formCue: "Feet high on pad for glute bias", target: "3 sets × 10-12 reps", sets: [{ weight: "40", reps: "12" }, { weight: "50", reps: "10" }, { weight: "50", reps: "10" }] },
          { name: "Cable Kickbacks or Hip Abductions", formCue: "Squeeze glute medius at peak outer movement", target: "3 sets × 12-15 reps", sets: [{ weight: "5", reps: "15" }, { weight: "7.5", reps: "12" }, { weight: "7.5", reps: "12" }] },
          { name: "Standing or Seated Leg Curls", formCue: "Full stretch, pause 1 second at bend", target: "3 sets × 10-12 reps", sets: [{ weight: "20", reps: "12" }, { weight: "25", reps: "10" }, { weight: "25", reps: "10" }] },
          { name: "Deadbugs / Hanging Leg Raises", formCue: "Exhale through effort, keep abs locked", target: "3 sets × 12-15 reps", sets: [{ weight: "BW", reps: "12" }, { weight: "BW", reps: "12" }] }
        ]
      }
    };

    // Default Mon-Fri Nutrition Plan
    const defaultMealPlan = [
      { id: 1, name: "Overnight Oats (30g oats, 100ml HL milk, chia, berries)", cals: 300, protein: 12, category: "Breakfast", checked: true },
      { id: 2, name: "2-in-1 No-Sugar Coffee", cals: 60, protein: 0, category: "Morning", checked: true },
      { id: 3, name: "Fresh Fruit (1 Apple or 1 Orange)", cals: 70, protein: 0, category: "Snack", checked: true },
      { id: 4, name: "Lunch: 2 Chapatis + Tofu/Egg Bhurji + Veggies & Spinach", cals: 400, protein: 25, category: "Lunch", checked: true },
      { id: 5, name: "Pre-Workout: 1 Slice Wholemeal Bread + 10g Peanut Butter", cals: 150, protein: 5, category: "Pre-Workout", checked: true },
      { id: 6, name: "Post-Workout: 1 Scoop Whey Protein Shake", cals: 120, protein: 25, category: "Post-Workout", checked: true },
      { id: 7, name: "Late Afternoon: 1 Tub Chobani Greek Yogurt", cals: 90, protein: 15, category: "Snack", checked: true },
      { id: 8, name: "Dinner: 1 Onion Paratha + Pre-Flavored Chicken Breast Fillet", cals: 350, protein: 22, category: "Dinner", checked: true },
      { id: 9, name: "Post-Dinner: 125g Marigold HL Yogurt + Frozen Berries", cals: 100, protein: 9, category: "Night Snack", checked: true }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('workout');
      const [selectedWeek, setSelectedWeek] = useState('Week 2');
      const [selectedDay, setSelectedDay] = useState('day1');
      
      // Gym Counter State (Start at 73 based on chat history)
      const [gymDays, setGymDays] = useState(() => {
        const saved = localStorage.getItem('fitpulse_gym_days');
        return saved ? parseInt(saved, 10) : 73;
      });

      // Steps Tracker
      const [dailySteps, setDailySteps] = useState(() => {
        const saved = localStorage.getItem('fitpulse_daily_steps');
        return saved ? parseInt(saved, 10) : 8500;
      });

      // Workout Data
      const [workoutLogs, setWorkoutLogs] = useState(() => {
        const saved = localStorage.getItem('fitpulse_workout_logs');
        return saved ? JSON.parse(saved) : initialWorkoutData;
      });

      // Nutrition Data
      const [meals, setMeals] = useState(() => {
        const saved = localStorage.getItem('fitpulse_meals');
        return saved ? JSON.parse(saved) : defaultMealPlan;
      });

      const [customMeal, setCustomMeal] = useState({ name: '', cals: '', protein: '' });

      // LocalStorage Persistence
      useEffect(() => {
        localStorage.setItem('fitpulse_gym_days', gymDays);
      }, [gymDays]);

      useEffect(() => {
        localStorage.setItem('fitpulse_daily_steps', dailySteps);
      }, [dailySteps]);

      useEffect(() => {
        localStorage.setItem('fitpulse_workout_logs', JSON.stringify(workoutLogs));
      }, [workoutLogs]);

      useEffect(() => {
        localStorage.setItem('fitpulse_meals', JSON.stringify(meals));
      }, [meals]);

      // Handlers for Workout Editing
      const handleSetChange = (dayKey, exIndex, setIndex, field, value) => {
        const updated = { ...workoutLogs };
        updated[dayKey].exercises[exIndex].sets[setIndex][field] = value;
        setWorkoutLogs(updated);
      };

      const addSet = (dayKey, exIndex) => {
        const updated = { ...workoutLogs };
        const sets = updated[dayKey].exercises[exIndex].sets;
        const lastSet = sets[sets.length - 1] || { weight: "10", reps: "10" };
        sets.push({ weight: lastSet.weight, reps: lastSet.reps });
        setWorkoutLogs(updated);
      };

      const removeSet = (dayKey, exIndex, setIndex) => {
        const updated = { ...workoutLogs };
        updated[dayKey].exercises[exIndex].sets.splice(setIndex, 1);
        setWorkoutLogs(updated);
      };

      // Nutrition Calculations
      const totalCals = meals.filter(m => m.checked).reduce((acc, curr) => acc + Number(curr.cals || 0), 0);
      const totalProtein = meals.filter(m => m.checked).reduce((acc, curr) => acc + Number(curr.protein || 0), 0);

      const toggleMeal = (id) => {
        setMeals(meals.map(m => m.id === id ? { ...m, checked: !m.checked } : m));
      };

      const addMealItem = (e) => {
        e.preventDefault();
        if (!customMeal.name) return;
        const newItem = {
          id: Date.now(),
          name: customMeal.name,
          cals: Number(customMeal.cals) || 0,
          protein: Number(customMeal.protein) || 0,
          category: "Custom",
          checked: true
        };
        setMeals([...meals, newItem]);
        setCustomMeal({ name: '', cals: '', protein: '' });
      };

      const exportToCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Week,Day,Exercise,Set,Weight (kg),Reps\n";

        Object.keys(workoutLogs).forEach(dayKey => {
          const day = workoutLogs[dayKey];
          day.exercises.forEach(ex => {
            ex.sets.forEach((set, sIdx) => {
              csvContent += `"${selectedWeek}","${day.title}","${ex.name}",${sIdx + 1},"${set.weight}","${set.reps}"\n`;
            });
          });
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Workout_Log_${selectedWeek}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="max-w-4xl mx-auto p-3 sm:p-6 pb-20">
          
          {/* Header Bar */}
          <header className="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 mb-6 shadow-xl">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <span className="text-xs uppercase tracking-widest text-emerald-400 font-bold">1-Month Calorie Deficit & Gym Split</span>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-white flex items-center gap-2">
                  <span>⚡</span> FitPulse 100 Tracker
                </h1>
              </div>

              {/* 100 Day Milestone Counter Widget */}
              <div className="bg-slate-900 border border-emerald-500/30 rounded-xl p-3 flex items-center gap-4 w-full sm:w-auto justify-between">
                <div>
                  <div className="text-xs text-slate-400 font-medium">100-Day Gym Goal</div>
                  <div className="text-xl font-bold text-emerald-400">
                    Day {gymDays} <span className="text-xs text-slate-400 font-normal">/ 100</span>
                  </div>
                  <div className="text-[10px] text-emerald-300">{100 - gymDays} days remaining!</div>
                </div>
                <button 
                  onClick={() => setGymDays(prev => prev + 1)}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg transition active:scale-95 shadow-md flex items-center gap-1"
                >
                  <span>+1</span> Log Gym
                </button>
              </div>
            </div>

            {/* Quick Macro Summary Dashboard */}
            <div className="grid grid-cols-3 gap-2 sm:gap-4 mt-5 pt-4 border-t border-slate-700/60">
              <div className="bg-slate-900/60 p-2.5 sm:p-3 rounded-lg border border-slate-700">
                <div className="text-[10px] sm:text-xs text-slate-400 uppercase font-semibold">Calories</div>
                <div className="text-base sm:text-xl font-bold text-amber-400">{totalCals} <span className="text-[10px] font-normal text-slate-400">/ 1600 kcal</span></div>
                <div className="w-full bg-slate-800 h-1.5 rounded-full mt-1.5 overflow-hidden">
                  <div className="bg-amber-400 h-full transition-all duration-300" style={{ width: `${Math.min((totalCals / 1600) * 100, 100)}%` }}></div>
                </div>
              </div>

              <div className="bg-slate-900/60 p-2.5 sm:p-3 rounded-lg border border-slate-700">
                <div className="text-[10px] sm:text-xs text-slate-400 uppercase font-semibold">Protein</div>
                <div className="text-base sm:text-xl font-bold text-emerald-400">{totalProtein}g <span className="text-[10px] font-normal text-slate-400">/ 115g</span></div>
                <div className="w-full bg-slate-800 h-1.5 rounded-full mt-1.5 overflow-hidden">
                  <div className="bg-emerald-400 h-full transition-all duration-300" style={{ width: `${Math.min((totalProtein / 115) * 100, 100)}%` }}></div>
                </div>
              </div>

              <div className="bg-slate-900/60 p-2.5 sm:p-3 rounded-lg border border-slate-700">
                <div className="text-[10px] sm:text-xs text-slate-400 uppercase font-semibold">Daily Steps</div>
                <div className="text-base sm:text-xl font-bold text-sky-400">{dailySteps.toLocaleString()} <span className="text-[10px] font-normal text-slate-400">/ 9k</span></div>
                <div className="w-full bg-slate-800 h-1.5 rounded-full mt-1.5 overflow-hidden">
                  <div className="bg-sky-400 h-full transition-all duration-300" style={{ width: `${Math.min((dailySteps / 9000) * 100, 100)}%` }}></div>
                </div>
              </div>
            </div>
          </header>

          {/* Tab Navigation */}
          <div className="flex bg-slate-800/80 p-1 rounded-xl mb-6 border border-slate-700">
            <button
              onClick={() => setActiveTab('workout')}
              className={`flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition ${activeTab === 'workout' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
            >
              🏋️ Workout Split
            </button>
            <button
              onClick={() => setActiveTab('nutrition')}
              className={`flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition ${activeTab === 'nutrition' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
            >
              🥗 Daily Fuel & Meals
            </button>
            <button
              onClick={() => setActiveTab('progress')}
              className={`flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition ${activeTab === 'progress' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
            >
              📊 100-Day Goal
            </button>
          </div>

          {/* TAB 1: WORKOUT SPLIT */}
          {activeTab === 'workout' && (
            <div className="space-y-6">
              
              {/* Controls Bar: Week Switcher & CSV Export */}
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-slate-800/50 p-4 rounded-xl border border-slate-700/60">
                <div className="flex items-center gap-2">
                  <span className="text-xs text-slate-400 font-medium">Select Week:</span>
                  {['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5'].map(wk => (
                    <button
                      key={wk}
                      onClick={() => setSelectedWeek(wk)}
                      className={`px-3 py-1 text-xs font-semibold rounded-md transition ${selectedWeek === wk ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}
                    >
                      {wk}
                    </button>
                  ))}
                </div>

                <button
                  onClick={exportToCSV}
                  className="w-full sm:w-auto bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-600 flex items-center justify-center gap-1.5 transition"
                >
                  📥 Export to Excel (.csv)
                </button>
              </div>

              {/* Day Selection Tabs */}
              <div className="grid grid-cols-5 gap-1.5 sm:gap-2">
                {[
                  { key: 'day1', label: 'Day 1', sub: 'Upper 1' },
                  { key: 'day2', label: 'Day 2', sub: 'Lower 1' },
                  { key: 'day3', label: 'Day 3', sub: 'Core/Cardio' },
                  { key: 'day4', label: 'Day 4', sub: 'Upper 2' },
                  { key: 'day5', label: 'Day 5', sub: 'Lower 2' },
                ].map(d => (
                  <button
                    key={d.key}
                    onClick={() => setSelectedDay(d.key)}
                    className={`p-2 sm:p-3 rounded-xl border text-center transition ${selectedDay === d.key ? 'bg-slate-800 border-emerald-500 text-white shadow-lg' : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:border-slate-700'}`}
                  >
                    <div className="text-xs sm:text-sm font-bold">{d.label}</div>
                    <div className="text-[10px] opacity-75 truncate">{d.sub}</div>
                  </button>
                ))}
              </div>

              {/* Selected Day Workout Card */}
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 space-y-6">
                <div>
                  <div className="text-xs uppercase font-bold text-emerald-400 tracking-wider">{selectedWeek} • {workoutLogs[selectedDay].focus}</div>
                  <h2 className="text-xl sm:text-2xl font-extrabold text-white">{workoutLogs[selectedDay].title}</h2>
                </div>

                {/* Exercise List */}
                <div className="space-y-6">
                  {workoutLogs[selectedDay].exercises.map((ex, exIdx) => (
                    <div key={exIdx} className="bg-slate-900/80 border border-slate-700/80 rounded-xl p-4 space-y-3">
                      <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-1">
                        <div>
                          <h3 className="font-bold text-slate-100 text-sm sm:text-base">{exIdx + 1}. {ex.name}</h3>
                          <div className="text-xs text-emerald-300 font-medium flex items-center gap-1">
                            <span>💡 Cues:</span> {ex.formCue}
                          </div>
                        </div>
                        <span className="text-xs font-medium text-slate-400 bg-slate-800 px-2.5 py-1 rounded-md self-start sm:self-center border border-slate-700">
                          Target: {ex.target}
                        </span>
                      </div>

                      {/* Sets Table */}
                      <div className="space-y-2 pt-2">
                        <div className="grid grid-cols-12 gap-2 text-[10px] font-bold text-slate-400 uppercase px-1">
                          <span className="col-span-2">Set</span>
                          <span className="col-span-4">Weight (kg)</span>
                          <span className="col-span-4">Reps</span>
                          <span className="col-span-2 text-right">Action</span>
                        </div>

                        {ex.sets.map((set, sIdx) => (
                          <div key={sIdx} className="grid grid-cols-12 gap-2 items-center bg-slate-800/60 p-1.5 rounded-lg border border-slate-700/50">
                            <span className="col-span-2 text-xs font-bold text-slate-300 px-1">Set {sIdx + 1}</span>
                            <div className="col-span-4">
                              <input
                                type="text"
                                value={set.weight}
                                onChange={(e) => handleSetChange(selectedDay, exIdx, sIdx, 'weight', e.target.value)}
                                placeholder="kg"
                                className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:border-emerald-500 outline-none"
                              />
                            </div>
                            <div className="col-span-4">
                              <input
                                type="text"
                                value={set.reps}
                                onChange={(e) => handleSetChange(selectedDay, exIdx, sIdx, 'reps', e.target.value)}
                                placeholder="reps"
                                className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white focus:border-emerald-500 outline-none"
                              />
                            </div>
                            <div className="col-span-2 text-right">
                              <button
                                onClick={() => removeSet(selectedDay, exIdx, sIdx)}
                                className="text-slate-500 hover:text-rose-400 text-xs px-1"
                                title="Remove Set"
                              >
                                ✕
                              </button>
                            </div>
                          </div>
                        ))}

                        <button
                          onClick={() => addSet(selectedDay, exIdx)}
                          className="mt-2 text-xs font-semibold text-emerald-400 hover:text-emerald-300 flex items-center gap-1 px-1 py-0.5"
                        >
                          + Add Set
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: NUTRITION & MEAL PLANNER */}
          {activeTab === 'nutrition' && (
            <div className="space-y-6">
              
              {/* Daily Meal Checklist */}
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-lg sm:text-xl font-bold text-white">Monday–Friday Deficit Meal Plan</h2>
                    <p className="text-xs text-slate-400">Target: ~1,500 - 1,650 kcal | Protein: 105 - 120g</p>
                  </div>
                  <button
                    onClick={() => setMeals(defaultMealPlan)}
                    className="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-600"
                  >
                    Reset Plan
                  </button>
                </div>

                <div className="space-y-2">
                  {meals.map(item => (
                    <div
                      key={item.id}
                      onClick={() => toggleMeal(item.id)}
                      className={`flex items-center justify-between p-3 rounded-xl border cursor-pointer transition ${item.checked ? 'bg-slate-900/90 border-slate-700' : 'bg-slate-900/30 border-slate-800 opacity-50'}`}
                    >
                      <div className="flex items-center gap-3">
                        <input
                          type="checkbox"
                          checked={item.checked}
                          onChange={() => {}}
                          className="w-4 h-4 accent-emerald-500 rounded"
                        />
                        <div>
                          <div className={`text-xs sm:text-sm font-semibold ${item.checked ? 'text-slate-100' : 'text-slate-500 line-through'}`}>
                            {item.name}
                          </div>
                          <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded uppercase font-bold">
                            {item.category}
                          </span>
                        </div>
                      </div>

                      <div className="text-right">
                        <div className="text-xs sm:text-sm font-bold text-amber-400">{item.cals} kcal</div>
                        <div className="text-[10px] sm:text-xs text-emerald-400 font-semibold">{item.protein}g protein</div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Add Custom Snack Form */}
                <form onSubmit={addMealItem} className="pt-4 border-t border-slate-700/60 space-y-3">
                  <div className="text-xs font-bold text-slate-300">Add Extra Food / Meal Item</div>
                  <div className="grid grid-cols-12 gap-2">
                    <input
                      type="text"
                      placeholder="Food item name (e.g., Apple, Latte)"
                      value={customMeal.name}
                      onChange={(e) => setCustomMeal({ ...customMeal, name: e.target.value })}
                      className="col-span-6 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-emerald-500 outline-none"
                    />
                    <input
                      type="number"
                      placeholder="Calories"
                      value={customMeal.cals}
                      onChange={(e) => setCustomMeal({ ...customMeal, cals: e.target.value })}
                      className="col-span-3 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:border-emerald-500 outline-none"
                    />
                    <input
                      type="number"
                      placeholder="Protein (g)"
                      value={customMeal.protein}
                      onChange={(e) => setCustomMeal({ ...customMeal, protein: e.target.value })}
                      className="col-span-3 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:border-emerald-500 outline-none"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2 rounded-lg transition"
                  >
                    + Add Item
                  </button>
                </form>
              </div>

              {/* Steps Tracker Settings */}
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                  <h3 className="font-bold text-white text-base">Daily Steps Tracker</h3>
                  <p className="text-xs text-slate-400">Aim for 8,000 - 10,000 steps to maintain daily fat loss burn.</p>
                </div>
                <div className="flex items-center gap-2">
                  <input
                    type="number"
                    value={dailySteps}
                    onChange={(e) => setDailySteps(Number(e.target.value))}
                    className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm font-bold text-sky-400 w-28 text-center outline-none focus:border-sky-500"
                  />
                  <span className="text-xs text-slate-400 font-semibold">steps</span>
                </div>
              </div>

            </div>
          )}

          {/* TAB 3: 100-DAY GOAL PROGRESS */}
          {activeTab === 'progress' && (
            <div className="space-y-6">
              
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 text-center space-y-4">
                <div className="inline-block p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-full text-emerald-400 text-3xl">
                  🏋️
                </div>
                <h2 className="text-2xl font-extrabold text-white">100-Day Gym Challenge Progress</h2>
                <p className="text-xs text-slate-400 max-w-md mx-auto">
                  You are currently at <strong className="text-emerald-400 font-bold">{gymDays} completed gym days</strong> out of your 100-day target for 2026. Only <strong className="text-white font-bold">{100 - gymDays} days left</strong>!
                </p>

                {/* Big Progress Bar */}
                <div className="w-full bg-slate-900 border border-slate-700 h-6 rounded-full overflow-hidden p-1">
                  <div
                    className="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-500 flex items-center justify-end pr-2 text-[10px] font-bold text-slate-950"
                    style={{ width: `${Math.min((gymDays / 100) * 100, 100)}%` }}
                  >
                    {gymDays}%
                  </div>
                </div>

                {/* Milestone Buttons */}
                <div className="flex justify-center gap-3 pt-2">
                  <button
                    onClick={() => setGymDays(prev => Math.max(0, prev - 1))}
                    className="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-600"
                  >
                    -1 Day
                  </button>
                  <button
                    onClick={() => setGymDays(prev => prev + 1)}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-1.5 rounded-lg shadow"
                  >
                    +1 Completed Day
                  </button>
                </div>
              </div>

              {/* Strategy Card */}
              <div className="bg-slate-800/60 border border-slate-700 rounded-2xl p-5 space-y-3">
                <h3 className="font-bold text-slate-200 text-sm">💡 October Goal Strategy</h3>
                <ul className="text-xs text-slate-400 space-y-2 list-disc pl-4 leading-relaxed">
                  <li><strong>Target Rate:</strong> ~0.3 to 0.4 kg pure fat loss per week with 105–115g daily protein.</li>
                  <li><strong>Lifting Pace:</strong> Stick to the 2-3s slow lowering (eccentric) tempo for all dumbbell press and row sets.</li>
                  <li><strong>Weekend Rest:</strong> Take Saturday and Sunday fully off to regenerate central nervous system recovery.</li>
                </ul>
              </div>

            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
