<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym & Health Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { border-bottom: 3px solid #34d399; color: #34d399; font-weight: 600; }
    .bg-emerald-card { background-color: #1e293b; border: 1px solid #334155; }
    input, select, textarea { background-color: #0f172a; color: #f8fafc; border: 1px solid #475569; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #10b981; }
  </style>
</head>
<body class="pb-24">

  <!-- TOP HEADER & 100-DAY GYM GOAL BADGE -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">Gym & Health Tracker</h1>
        <p class="text-xs text-slate-400">5-Week Program & Daily Habit Log</p>
      </div>
      <div class="bg-slate-800 border border-emerald-500/30 rounded-lg px-3 py-1.5 text-right flex items-center gap-3">
        <div>
          <div class="text-[10px] uppercase tracking-wider text-slate-400">Gym Goal</div>
          <div class="text-sm font-bold text-emerald-300" id="gymGoalCounter">Day 73 / 100</div>
        </div>
        <button onclick="incrementGymGoal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-2 py-1 rounded transition">+1</button>
      </div>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="bg-slate-900/90 border-b border-slate-800 sticky top-[65px] z-40 backdrop-blur">
    <div class="max-w-xl mx-auto flex justify-around text-sm text-slate-400 font-medium">
      <button id="tabBtnWorkout" onclick="switchTab('workout')" class="py-3 px-4 tab-active">🏋️ Workout</button>
      <button id="tabBtnNutrition" onclick="switchTab('nutrition')" class="py-3 px-4">🥗 Nutrition</button>
      <button id="tabBtnSteps" onclick="switchTab('steps')" class="py-3 px-4">🚶 Steps</button>
    </div>
  </nav>

  <main class="max-w-xl mx-auto p-4">

    <!-- ==================== TAB 1: WORKOUT ==================== -->
    <section id="tabWorkout" class="space-y-4">
      
      <!-- WEEK SELECTOR -->
      <div class="flex items-center justify-between bg-slate-800 p-2 rounded-lg border border-slate-700">
        <label class="text-xs font-bold text-slate-300 uppercase">Select Week:</label>
        <select id="weekSelector" onchange="renderWorkout()" class="text-xs rounded px-2 py-1 font-semibold text-emerald-400">
          <option value="1">Week 1</option>
          <option value="2">Week 2</option>
          <option value="3">Week 3</option>
          <option value="4">Week 4</option>
          <option value="5">Week 5</option>
        </select>
      </div>

      <!-- DAY SELECTOR -->
      <div class="grid grid-cols-5 gap-1" id="dayButtons">
        <button onclick="selectDay(1)" id="dayBtn1" class="py-2 text-xs font-bold rounded bg-emerald-600 text-white">Day 1</button>
        <button onclick="selectDay(2)" id="dayBtn2" class="py-2 text-xs font-bold rounded bg-slate-800 text-slate-400">Day 2</button>
        <button onclick="selectDay(3)" id="dayBtn3" class="py-2 text-xs font-bold rounded bg-slate-800 text-slate-400">Day 3</button>
        <button onclick="selectDay(4)" id="dayBtn4" class="py-2 text-xs font-bold rounded bg-slate-800 text-slate-400">Day 4</button>
        <button onclick="selectDay(5)" id="dayBtn5" class="py-2 text-xs font-bold rounded bg-slate-800 text-slate-400">Day 5</button>
      </div>

      <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700 flex justify-between items-center">
        <h2 id="routineTitle" class="font-bold text-emerald-300 text-base">Day 1 - Upper 1</h2>
        <span class="text-xs text-slate-400">Log Sets, Weights & Reps</span>
      </div>

      <!-- WORKOUT EXERCISE CARDS CONTAINER -->
      <div id="exerciseContainer" class="space-y-4"></div>

    </section>

    <!-- ==================== TAB 2: NUTRITION ==================== -->
    <section id="tabNutrition" class="space-y-4 hidden">
      <div class="flex items-center justify-between bg-slate-800 p-3 rounded-lg border border-slate-700">
        <div>
          <h2 class="font-bold text-emerald-300 text-sm">Daily Meal Tracker</h2>
          <p class="text-xs text-slate-400" id="nutritionTotals">Calories: 0 kcal | Protein: 0g</p>
        </div>
        <input type="date" id="nutritionDate" onchange="loadNutritionDate()" class="text-xs rounded px-2 py-1 text-slate-200">
      </div>

      <!-- STAPLE MEAL SLOTS -->
      <div id="mealSlotsContainer" class="space-y-3"></div>

      <!-- CUSTOM MEAL LOGGER -->
      <div class="bg-emerald-card p-4 rounded-xl space-y-3">
        <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Log Custom / Off-Plan Food</h3>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <input type="text" id="customItemName" placeholder="Dish name..." class="p-2 rounded col-span-3">
          <input type="number" id="customItemCals" placeholder="Calories" class="p-2 rounded">
          <input type="number" id="customItemProtein" placeholder="Protein (g)" class="p-2 rounded">
          <button onclick="addCustomMeal()" class="bg-emerald-600 hover:bg-emerald-500 font-bold text-white rounded p-2">Add Dish</button>
        </div>
      </div>
    </section>

    <!-- ==================== TAB 3: STEP COUNTER ==================== -->
    <section id="tabSteps" class="space-y-4 hidden">
      <div class="bg-emerald-card p-4 rounded-xl space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-emerald-400 uppercase tracking-wider">Step Tracker</h2>
          <input type="date" id="stepDate" onchange="loadStepDate()" class="text-xs rounded px-2 py-1">
        </div>
        
        <div class="text-center py-4 bg-slate-900/60 rounded-lg border border-slate-800">
          <div class="text-3xl font-extrabold text-emerald-300" id="stepDisplay">0</div>
          <div class="text-xs text-slate-400 mt-1">Total Steps Logged For Date</div>
        </div>

        <div class="flex gap-2">
          <input type="number" id="stepInput" placeholder="Add steps (e.g. 3000)" class="flex-1 p-2 rounded text-sm">
          <button onclick="addSteps()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded text-sm">+ Add</button>
        </div>
      </div>
    </section>

  </main>

  <script>
    // --- WORKOUT PROGRAM DATA SCHEME ---
    const workoutProgram = {
      1: {
        title: "Day 1 - Upper 1",
        exercises: [
          { name: "Incline DB Press", target: "8-10 reps" },
          { name: "Chest-Supported Row", target: "8-10 reps" },
          { name: "Standing/Seated Overhead Press", target: "10-12 reps" },
          { name: "Cable or Band Face Pulls", target: "12-15 reps" },
          { name: "DB Bicep Curls", target: "10-12 reps" },
          { name: "Overhead Tricep Extensions", target: "12-15 reps" }
        ]
      },
      2: {
        title: "Day 2 - Lower 1",
        exercises: [
          { name: "DB Goblet Squat", target: "8-10 reps" },
          { name: "Barbell / DB Walking Lunges", target: "8-10 reps" },
          { name: "DB Bulgarian Split Squat", target: "8-10 reps" },
          { name: "Seated or Lying Leg Curl", target: "12-15 reps" },
          { name: "Standing Calf Raises", target: "15 reps" }
        ]
      },
      3: {
        title: "Day 3 - Core & LISS",
        exercises: [
          { name: "Lying Reverse Crunches or Leg Raises", target: "12-15 reps" },
          { name: "Cable Woodchoppers", target: "12-15 reps" },
          { name: "Plank / Side Plank Hold", target: "45-60 sec" },
          { name: "Zone 2 Cardio (Incline Treadmill Walk)", target: "20-30 min" },
          { name: "Hip & Thoracic Mobility Flow", target: "8-10 reps" }
        ]
      },
      4: {
        title: "Day 4 - Upper 2",
        exercises: [
          { name: "Lat Pulldown or Single-Arm Pulldown", target: "8-10 reps" },
          { name: "Flat DB Bench Press", target: "10-12 reps" },
          { name: "Single-Arm DB Row", target: "12-15 reps" },
          { name: "DB Lateral Raises", target: "12-15 reps" },
          { name: "DB Hammer Curls", target: "10-12 reps" }
        ]
      },
      5: {
        title: "Day 5 - Lower 2",
        exercises: [
          { name: "DB Romanian Deadlift (RDL)", target: "8-10 reps" },
          { name: "Leg Press / Goblet Squat", target: "10-12 reps" },
          { name: "Cable Kickbacks / Glute Bridges", target: "12-15 reps" },
          { name: "Lying or Seated Leg Curls", target: "10-12 reps" }
        ]
      }
    };

    let selectedDay = 1;

    function init() {
      const todayStr = new Date().toISOString().split('T')[0];
      document.getElementById('nutritionDate').value = todayStr;
      document.getElementById('stepDate').value = todayStr;
      renderWorkout();
      loadStepDate();
    }

    function switchTab(tab) {
      document.getElementById('tabWorkout').classList.add('hidden');
      document.getElementById('tabNutrition').classList.add('hidden');
      document.getElementById('tabSteps').classList.add('hidden');
      document.getElementById('tabBtnWorkout').classList.remove('tab-active');
      document.getElementById('tabBtnNutrition').classList.remove('tab-active');
      document.getElementById('tabBtnSteps').classList.remove('tab-active');

      if (tab === 'workout') {
        document.getElementById('tabWorkout').classList.remove('hidden');
        document.getElementById('tabBtnWorkout').classList.add('tab-active');
      } else if (tab === 'nutrition') {
        document.getElementById('tabNutrition').classList.remove('hidden');
        document.getElementById('tabBtnNutrition').classList.add('tab-active');
      } else if (tab === 'steps') {
        document.getElementById('tabSteps').classList.remove('hidden');
        document.getElementById('tabBtnSteps').classList.add('tab-active');
      }
    }

    function selectDay(day) {
      selectedDay = day;
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`dayBtn${i}`);
        if (i === day) {
          btn.className = "py-2 text-xs font-bold rounded bg-emerald-600 text-white";
        } else {
          btn.className = "py-2 text-xs font-bold rounded bg-slate-800 text-slate-400";
        }
      }
      renderWorkout();
    }

    function renderWorkout() {
      const week = document.getElementById('weekSelector').value;
      const routine = workoutProgram[selectedDay];
      document.getElementById('routineTitle').innerText = `${routine.title} (Week ${week})`;

      const container = document.getElementById('exerciseContainer');
      container.innerHTML = "";

      routine.exercises.forEach((ex, idx) => {
        const key = `w${week}_d${selectedDay}_ex${idx}`;
        const savedData = JSON.parse(localStorage.getItem(key) || '{"sets":[{"kg":"","reps":""},{"kg":"","reps":""},{"kg":"","reps":""}]}');

        let cardHtml = `
          <div class="bg-emerald-card p-3 rounded-xl space-y-2">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
              <span class="text-sm font-semibold text-slate-100">${ex.name}</span>
              <span class="text-xs text-emerald-400 font-mono">Target: ${ex.target}</span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-xs text-slate-400 font-semibold mb-1 text-center">
              <span>SET</span><span>KG</span><span>REPS</span>
            </div>
        `;

        savedData.sets.forEach((set, sIdx) => {
          cardHtml += `
            <div class="grid grid-cols-3 gap-2 items-center">
              <span class="text-center text-xs text-slate-400 font-bold">Set ${sIdx + 1}</span>
              <input type="number" step="0.5" value="${set.kg}" onchange="saveExercise('${key}', ${sIdx}, 'kg', this.value)" placeholder="kg" class="p-1 rounded text-center text-xs">
              <input type="number" value="${set.reps}" onchange="saveExercise('${key}', ${sIdx}, 'reps', this.value)" placeholder="reps" class="p-1 rounded text-center text-xs">
            </div>
          `;
        });

        cardHtml += `</div>`;
        container.innerHTML += cardHtml;
      });
    }

    function saveExercise(key, setIdx, field, val) {
      let savedData = JSON.parse(localStorage.getItem(key) || '{"sets":[{"kg":"","reps":""},{"kg":"","reps":""},{"kg":"","reps":""}]}');
      savedData.sets[setIdx][field] = val;
      localStorage.setItem(key, JSON.stringify(savedData));
    }

    function incrementGymGoal() {
      let current = parseInt(localStorage.getItem('gymGoalCount') || '73');
      current += 1;
      localStorage.setItem('gymGoalCount', current);
      document.getElementById('gymGoalCounter').innerText = `Day ${current} / 100`;
    }

    function loadStepDate() {
      const date = document.getElementById('stepDate').value;
      const steps = localStorage.getItem(`steps_${date}`) || '0';
      document.getElementById('stepDisplay').innerText = Number(steps).toLocaleString();
    }

    function addSteps() {
      const date = document.getElementById('stepDate').value;
      const input = document.getElementById('stepInput');
      const added = parseInt(input.value) || 0;
      let current = parseInt(localStorage.getItem(`steps_${date}`) || '0');
      current += added;
      localStorage.setItem(`steps_${date}`, current);
      input.value = '';
      loadStepDate();
    }

    // Initialize initial counter state
    document.getElementById('gymGoalCounter').innerText = `Day ${localStorage.getItem('gymGoalCount') || '73'} / 100`;
    init();
  </script>
</body>
</html>
