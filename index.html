<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym & Healthy Eating Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const getTodayStr = () => new Date().toISOString().split('T')[0];

    const MEAL_SLOTS = [
      "Breakfast",
      "Mid-Morning",
      "Lunch",
      "Pre-Workout",
      "Post-Workout",
      "Afternoon Snack",
      "Dinner",
      "Night Snack"
    ];

    const DAYS_OF_WEEK = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

    // Default Mon-Fri Standard Meal Template
    const defaultMealPlan = [
      { id: 1, name: "Overnight Oats (30g oats, 100ml HL milk, chia, berries)", cals: 300, protein: 12, slot: "Breakfast" },
      { id: 2, name: "1 Apple or 1 Orange", cals: 70, protein: 0, slot: "Mid-Morning" },
      { id: 3, name: "Dabba Street Leftovers / Tofu Egg Bhurji + 2 Chapatis", cals: 400, protein: 25, slot: "Lunch" },
      { id: 4, name: "1 Slice Wholemeal Bread + 10g Peanut Butter", cals: 150, protein: 5, slot: "Pre-Workout" },
      { id: 5, name: "1 Scoop Whey Protein Shake", cals: 120, protein: 25, slot: "Post-Workout" },
      { id: 6, name: "1 Tub Chobani Greek Yogurt", cals: 90, protein: 15, slot: "Afternoon Snack" },
      { id: 7, name: "Dabba Street Dinner / 1 Paratha + Chicken Breast", cals: 420, protein: 28, slot: "Dinner" },
      { id: 8, name: "125g Marigold HL Yogurt + Frozen Berries", cals: 100, protein: 9, slot: "Night Snack" }
    ];

    const initialWorkoutData = {
      day1: {
        title: "Day 1: Upper 1 (Push / Horizontal Pull)",
        focus: "Chest, Back, Shoulders & Arms",
        exercises: [
          { name: "Incline DB Bench Press", formCue: "45° elbow tuck, 2-3s lowering tempo", target: "3 sets × 8-10 reps", sets: [{ weight: "7.5", reps: "10" }, { weight: "10", reps: "4" }, { weight: "7.5", reps: "4" }] },
          { name: "Single-Arm DB Rows", formCue: "Deep stretch at bottom, elbow to hip", target: "3 sets × 8-10 reps", sets: [{ weight: "10", reps: "10" }, { weight: "12.5", reps: "8" }, { weight: "10", reps: "2" }] },
          { name: "Neutral DB Shoulder Press", formCue: "Palms facing in to protect shoulders", target: "3 sets × 8-10 reps", sets: [{ weight: "5", reps: "10" }, { weight: "7.5", reps: "8" }, { weight: "7.5", reps: "9" }] },
          { name: "Cable/Band Face Pulls", formCue: "Pull rope to forehead, flare elbows high", target: "3 sets × 12-15 reps", sets: [{ weight: "15", reps: "10" }, { weight: "20", reps: "10" }, { weight: "25", reps: "8" }] },
          { name: "DB Bicep Curls", formCue: "Squeeze bicep at top, slow descent", target: "3 sets × 10-12 reps", sets: [{ weight: "5", reps: "10" }, { weight: "7.5", reps: "6" }, { weight: "7.5", reps: "6" }] },
          { name: "Overhead DB Tricep Extension", formCue: "Keep elbows tucked forward", target: "3 sets × 10-12 reps", sets: [{ weight: "7.5", reps: "10" }, { weight: "10", reps: "8" }, { weight: "10", reps: "10" }] }
        ]
      },
      day2: {
        title: "Day 2: Lower 1 (Quads & Glute Focus)",
        focus: "Quads, Glute Max & Core",
        exercises: [
          { name: "DB Goblet / Barbell Squat", formCue: "Keep chest proud, knee inline with toes", target: "3-4 sets × 6-8 reps", sets: [{ weight: "12", reps: "8" }, { weight: "14", reps: "8" }, { weight: "14", reps: "8" }] },
          { name: "Barbell / DB Hip Thrusts", formCue: "Chin tucked, squeeze glutes hard at peak", target: "3-4 sets × 8-12 reps", sets: [{ weight: "20", reps: "12" }, { weight: "25", reps: "10" }, { weight: "25", reps: "10" }] },
          { name: "Bulgarian Split Squats", formCue: "Slight forward torso lean for glute drive", target: "3 sets × 8-10 reps/leg", sets: [{ weight: "6", reps: "10" }, { weight: "8", reps: "8" }, { weight: "8", reps: "8" }] },
          { name: "Seated or Lying Leg Curls", formCue: "Squeeze hamstrings, 2s slow release", target: "3 sets × 12-15 reps", sets: [{ weight: "20", reps: "12" }, { weight: "25", reps: "12" }, { weight: "25", reps: "10" }] }
        ]
      },
      day3: {
        title: "Day 3: Core, Cardio & Conditioning",
        focus: "Active Recovery & Core Endurance",
        exercises: [
          { name: "Reverse Crunches / Knee Raises", formCue: "Exhale on lift, slow lower", target: "3 sets × 15 reps", sets: [{ weight: "BW", reps: "15" }, { weight: "BW", reps: "15" }] },
          { name: "Cable Woodchoppers", formCue: "Pivot hips, brace core through turn", target: "3 sets × 12 reps/side", sets: [{ weight: "7.5", reps: "12" }, { weight: "10", reps: "12" }] },
          { name: "Zone 2 LISS Cardio Treadmill Walk", formCue: "Speed 4.0-4.5 km/h, Incline 6-10%", target: "25-30 minutes continuous", sets: [{ weight: "Incline 8%", reps: "25 min" }] }
        ]
      },
      day4: {
        title: "Day 4: Upper 2 (Vertical Pull & Accessories)",
        focus: "Lats, Upper Back & Lateral Delts",
        exercises: [
          { name: "Lat Pulldown / Single-Arm Row", formCue: "Full overhead stretch, drive elbow to rib", target: "3-4 sets × 8-12 reps", sets: [{ weight: "25", reps: "12" }, { weight: "30", reps: "10" }] },
          { name: "Flat DB Bench Press / DB Flyes", formCue: "Soft elbows on flyes, deep chest stretch", target: "3 sets × 10-12 reps", sets: [{ weight: "8", reps: "12" }, { weight: "10", reps: "10" }] },
          { name: "DB Lateral Raises", formCue: "Lead with elbows, pour the tea motion", target: "3-4 sets × 12-15 reps", sets: [{ weight: "4", reps: "15" }, { weight: "5", reps: "12" }] }
        ]
      },
      day5: {
        title: "Day 5: Lower 2 (Posterior Chain & Hamstrings)",
        focus: "Hamstrings, Glutes & Lower Back",
        exercises: [
          { name: "DB / Barbell RDLs", formCue: "Push hips back, 2-3s eccentric, flat back", target: "4 sets × 8-10 reps", sets: [{ weight: "12", reps: "10" }, { weight: "14", reps: "10" }] },
          { name: "Leg Press / Hack Squat", formCue: "Feet high on pad for glute bias", target: "3 sets × 10-12 reps", sets: [{ weight: "40", reps: "12" }, { weight: "50", reps: "10" }] }
        ]
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState('nutrition');
      const [selectedWeek, setSelectedWeek] = useState('Week 2');
      const [selectedDay, setSelectedDay] = useState('day1');

      // Gym Counter State
      const [gymDays, setGymDays] = useState(() => {
        const saved = localStorage.getItem('fitpulse_gym_days');
        return saved ? parseInt(saved, 10) : 73;
      });

      // Workout Data
      const [workoutLogs, setWorkoutLogs] = useState(() => {
        const saved = localStorage.getItem('fitpulse_workout_logs');
        return saved ? JSON.parse(saved) : initialWorkoutData;
      });

      // Date-based Daily Food Logs
      const [selectedDate, setSelectedDate] = useState(getTodayStr());
      const [dailyLogs, setDailyLogs] = useState(() => {
        const saved = localStorage.getItem('fitpulse_daily_food_logs');
        if (saved) return JSON.parse(saved);
        return { [getTodayStr()]: defaultMealPlan };
      });

      // Upcoming Week Regular Meal Plan State
      const [weeklyPlan, setWeeklyPlan] = useState(() => {
        const saved = localStorage.getItem('fitpulse_weekly_regular_plan');
        if (saved) return JSON.parse(saved);
        const plan = {};
        DAYS_OF_WEEK.forEach(day => {
          plan[day] = defaultMealPlan;
        });
        return plan;
      });

      const [selectedPlannerDay, setSelectedPlannerDay] = useState("Monday");

      // Steps Tracker
      const [stepLogs, setStepLogs] = useState(() => {
        const saved = localStorage.getItem('fitpulse_daily_step_logs');
        if (saved) return JSON.parse(saved);
        return { [getTodayStr()]: [{ id: 1, count: 8500, time: "Initial" }] };
      });

      // Input states for meal-by-meal adding
      const [mealInputs, setMealInputs] = useState({});
      const [plannerInputs, setPlannerInputs] = useState({});
      const [stepInput, setStepInput] = useState('');

      useEffect(() => {
        localStorage.setItem('fitpulse_gym_days', gymDays);
      }, [gymDays]);

      useEffect(() => {
        localStorage.setItem('fitpulse_workout_logs', JSON.stringify(workoutLogs));
      }, [workoutLogs]);

      useEffect(() => {
        localStorage.setItem('fitpulse_daily_food_logs', JSON.stringify(dailyLogs));
      }, [dailyLogs]);

      useEffect(() => {
        localStorage.setItem('fitpulse_weekly_regular_plan', JSON.stringify(weeklyPlan));
      }, [weeklyPlan]);

      useEffect(() => {
        localStorage.setItem('fitpulse_daily_step_logs', JSON.stringify(stepLogs));
      }, [stepLogs]);

      // Calculations for Selected Date Log
      const currentMeals = dailyLogs[selectedDate] || [];
      const currentStepSessions = stepLogs[selectedDate] || [];

      const totalCals = currentMeals.reduce((acc, curr) => acc + Number(curr.cals || 0), 0);
      const totalProtein = currentMeals.reduce((acc, curr) => acc + Number(curr.protein || 0), 0);
      const totalSteps = currentStepSessions.reduce((acc, curr) => acc + Number(curr.count || 0), 0);

      const calTarget = 1600;
      const calDiff = totalCals - calTarget;

      // Add Food to specific Meal Slot on Selected Date
      const handleAddMealItem = (slot) => {
        const input = mealInputs[slot] || {};
        if (!input.name) return;

        const newItem = {
          id: Date.now(),
          name: input.name,
          cals: Number(input.cals) || 0,
          protein: Number(input.protein) || 0,
          slot: slot
        };

        const updated = [...currentMeals, newItem];
        setDailyLogs({ ...dailyLogs, [selectedDate]: updated });

        // Reset input for this slot
        setMealInputs({ ...mealInputs, [slot]: { name: '', cals: '', protein: '' } });
      };

      const removeMealItem = (id) => {
        const updated = currentMeals.filter(item => item.id !== id);
        setDailyLogs({ ...dailyLogs, [selectedDate]: updated });
      };

      const loadStandardPlanForDate = () => {
        setDailyLogs({ ...dailyLogs, [selectedDate]: [...defaultMealPlan] });
      };

      const loadWeeklyPlannerDayIntoDate = () => {
        const dayOfWeek = new Date(selectedDate).toLocaleDateString('en-US', { weekday: 'long' });
        const plannedForDay = weeklyPlan[dayOfWeek] || defaultMealPlan;
        setDailyLogs({ ...dailyLogs, [selectedDate]: [...plannedForDay] });
      };

      const clearSelectedDateLog = () => {
        setDailyLogs({ ...dailyLogs, [selectedDate]: [] });
      };

      // Add Food to Upcoming Week Planner Day
      const handleAddPlannerItem = (slot) => {
        const input = plannerInputs[slot] || {};
        if (!input.name) return;

        const newItem = {
          id: Date.now(),
          name: input.name,
          cals: Number(input.cals) || 0,
          protein: Number(input.protein) || 0,
          slot: slot
        };

        const currentDayPlan = weeklyPlan[selectedPlannerDay] || [];
        const updated = [...currentDayPlan, newItem];
        setWeeklyPlan({ ...weeklyPlan, [selectedPlannerDay]: updated });

        setPlannerInputs({ ...plannerInputs, [slot]: { name: '', cals: '', protein: '' } });
      };

      const removePlannerItem = (id) => {
        const currentDayPlan = weeklyPlan[selectedPlannerDay] || [];
        const updated = currentDayPlan.filter(item => item.id !== id);
        setWeeklyPlan({ ...weeklyPlan, [selectedPlannerDay]: updated });
      };

      // Steps Logic
      const handleAddSteps = (e) => {
        e.preventDefault();
        const countVal = parseInt(stepInput, 10);
        if (!countVal || countVal <= 0) return;

        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const newStepEntry = { id: Date.now(), count: countVal, time: timeStr };

        const updated = [...currentStepSessions, newStepEntry];
        setStepLogs({ ...stepLogs, [selectedDate]: updated });
        setStepInput('');
      };

      const removeStepSession = (id) => {
        const updated = currentStepSessions.filter(s => s.id !== id);
        setStepLogs({ ...stepLogs, [selectedDate]: updated });
      };

      // Workout Handlers
      const handleSetChange = (dayKey, exIndex, setIndex, field, value) => {
        const updated = { ...workoutLogs };
        updated[dayKey].exercises[exIndex].sets[setIndex][field] = value;
        setWorkoutLogs(updated);
      };

      const addSet = (dayKey, exIndex) => {
        const updated = { ...workoutLogs };
        const sets = updated[dayKey].exercises[exIndex].sets;
        const lastSet = sets[sets.length - 1] || { weight: "10", reps: "10" };
        sets.push({ weight: lastSet.weight, reps: lastSet.reps });
        setWorkoutLogs(updated);
      };

      const removeSet = (dayKey, exIndex, setIndex) => {
        const updated = { ...workoutLogs };
        updated[dayKey].exercises[exIndex].sets.splice(setIndex, 1);
        setWorkoutLogs(updated);
      };

      return (
        <div className="max-w-4xl mx-auto p-3 sm:p-6 pb-20">
          
          {/* Main Top Dashboard Header */}
          <header className="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 mb-6 shadow-xl">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div>
                <span className="text-xs uppercase tracking-widest text-emerald-400 font-bold">FitPulse 100 Calorie Deficit & Gym Split</span>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-white flex items-center gap-2">
                  <span>⚡</span> FitPulse Tracker
                </h1>
              </div>

              <div className="bg-slate-900 border border-emerald-500/30 rounded-xl p-3 flex items-center gap-4 w-full sm:w-auto justify-between">
                <div>
                  <div className="text-xs text-slate-400 font-medium">100-Day Gym Goal</div>
                  <div className="text-xl font-bold text-emerald-400">
                    Day {gymDays} <span className="text-xs text-slate-400 font-normal">/ 100</span>
                  </div>
                </div>
                <button 
                  onClick={() => setGymDays(prev => prev + 1)}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg transition"
                >
                  +1 Log Gym
                </button>
              </div>
            </div>

            {/* Quick Macro Bar */}
            <div className="grid grid-cols-3 gap-2 sm:gap-4 mt-5 pt-4 border-t border-slate-700/60">
              <div className="bg-slate-900/60 p-2.5 sm:p-3 rounded-lg border border-slate-700">
                <div className="text-[10px] sm:text-xs text-slate-400 uppercase font-semibold">Calories ({selectedDate})</div>
                <div className={`text-base sm:text-xl font-bold ${calDiff > 0 ? 'text-rose-400' : 'text-amber-400'}`}>
                  {totalCals} <span className="text-[10px] font-normal text-slate-400">/ 1600 kcal</span>
                </div>
              </div>

              <div className="bg-slate-900/60 p-2.5 sm:p-3 rounded-lg border border-slate-700">
                <div className="text-[10px] sm:text-xs text-slate-400 uppercase font-semibold">Protein</div>
                <div className="text-base sm:text-xl font-bold text-emerald-400">{totalProtein}g <span className="text-[10px] font-normal text-slate-400">/ 115g</span></div>
              </div>

              <div className="bg-slate-900/60 p-2.5 sm:p-3 rounded-lg border border-slate-700">
                <div className="text-[10px] sm:text-xs text-slate-400 uppercase font-semibold">Steps</div>
                <div className="text-base sm:text-xl font-bold text-sky-400">{totalSteps.toLocaleString()} <span className="text-[10px] font-normal text-slate-400">/ 10k</span></div>
              </div>
            </div>
          </header>

          {/* Navigation Tabs */}
          <div className="flex bg-slate-800/80 p-1 rounded-xl mb-6 border border-slate-700">
            <button
              onClick={() => setActiveTab('nutrition')}
              className={`flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition ${activeTab === 'nutrition' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
            >
              🥗 Daily & Weekly Nutrition
            </button>
            <button
              onClick={() => setActiveTab('workout')}
              className={`flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition ${activeTab === 'workout' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
            >
              🏋️ Workout Split
            </button>
            <button
              onClick={() => setActiveTab('progress')}
              className={`flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition ${activeTab === 'progress' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
            >
              📊 Goal Progress
            </button>
          </div>

          {/* TAB: NUTRITION (MEAL-BY-MEAL LOGGING + UPCOMING WEEK PLANNER) */}
          {activeTab === 'nutrition' && (
            <div className="space-y-8">
              
              {/* SECTION 1: DAILY MEAL-BY-MEAL LOG */}
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 space-y-5">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                  <div>
                    <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                      🍽️ Meal-by-Meal Daily Log
                    </h2>
                    <p className="text-xs text-slate-400">Log meals slot-by-slot for specific dates or deviations.</p>
                  </div>

                  {/* Date Control */}
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setSelectedDate(getTodayStr())}
                      className={`px-3 py-1.5 text-xs font-semibold rounded-lg border transition ${selectedDate === getTodayStr() ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-700 text-slate-300 border-slate-600'}`}
                    >
                      Today
                    </button>
                    <input
                      type="date"
                      value={selectedDate}
                      onChange={(e) => setSelectedDate(e.target.value)}
                      className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-emerald-400 font-bold outline-none"
                    />
                  </div>
                </div>

                {/* Status & Quick Action Buttons */}
                <div className="flex flex-wrap items-center justify-between gap-2 p-3 bg-slate-900/80 rounded-xl border border-slate-700">
                  <div className="text-xs font-semibold">
                    {calDiff > 0 ? (
                      <span className="text-rose-400">⚠️ +{calDiff} kcal over 1600 budget</span>
                    ) : (
                      <span className="text-emerald-400">✅ {Math.abs(calDiff)} kcal remaining</span>
                    )}
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={loadWeeklyPlannerDayIntoDate}
                      className="text-[11px] bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1 rounded-lg border border-slate-600 transition"
                      title="Load pre-planned schedule for this day of week"
                    >
                      📅 Load Weekly Plan
                    </button>
                    <button
                      onClick={loadStandardPlanForDate}
                      className="text-[11px] bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 px-2.5 py-1 rounded-lg border border-emerald-500/30 font-semibold transition"
                    >
                      📋 Load Standard Plan
                    </button>
                    <button
                      onClick={clearSelectedDateLog}
                      className="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-400 px-2 py-1 rounded-lg border border-slate-700 transition"
                    >
                      🗑 Clear
                    </button>
                  </div>
                </div>

                {/* Meal Slots List */}
                <div className="space-y-4">
                  {MEAL_SLOTS.map(slot => {
                    const slotMeals = currentMeals.filter(m => m.slot === slot);
                    const slotInput = mealInputs[slot] || { name: '', cals: '', protein: '' };

                    return (
                      <div key={slot} className="bg-slate-900/70 border border-slate-700/80 rounded-xl p-3.5 space-y-2.5">
                        <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                          <span className="text-xs font-bold uppercase tracking-wider text-emerald-400">{slot}</span>
                          <span className="text-[11px] text-slate-400">
                            {slotMeals.reduce((a, c) => a + Number(c.cals || 0), 0)} kcal | {slotMeals.reduce((a, c) => a + Number(c.protein || 0), 0)}g protein
                          </span>
                        </div>

                        {/* List items in this slot */}
                        {slotMeals.length > 0 && (
                          <div className="space-y-1.5">
                            {slotMeals.map(item => (
                              <div key={item.id} className="flex justify-between items-center bg-slate-800/80 px-3 py-2 rounded-lg border border-slate-700/50">
                                <span className="text-xs font-medium text-slate-200">{item.name}</span>
                                <div className="flex items-center gap-3">
                                  <span className="text-xs font-bold text-amber-400">{item.cals} kcal</span>
                                  <span className="text-xs font-bold text-emerald-400">{item.protein}g P</span>
                                  <button onClick={() => removeMealItem(item.id)} className="text-slate-500 hover:text-rose-400 text-xs">✕</button>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}

                        {/* Direct Slot Input Form */}
                        <div className="grid grid-cols-12 gap-2 pt-1">
                          <input
                            type="text"
                            placeholder={`Add item to ${slot}...`}
                            value={slotInput.name || ''}
                            onChange={(e) => setMealInputs({
                              ...mealInputs,
                              [slot]: { ...slotInput, name: e.target.value }
                            })}
                            className="col-span-6 bg-slate-800 border border-slate-700 rounded px-2.5 py-1 text-xs text-white outline-none focus:border-emerald-500"
                          />
                          <input
                            type="number"
                            placeholder="kcal"
                            value={slotInput.cals || ''}
                            onChange={(e) => setMealInputs({
                              ...mealInputs,
                              [slot]: { ...slotInput, cals: e.target.value }
                            })}
                            className="col-span-2 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white outline-none focus:border-emerald-500"
                          />
                          <input
                            type="number"
                            placeholder="g protein"
                            value={slotInput.protein || ''}
                            onChange={(e) => setMealInputs({
                              ...mealInputs,
                              [slot]: { ...slotInput, protein: e.target.value }
                            })}
                            className="col-span-2 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white outline-none focus:border-emerald-500"
                          />
                          <button
                            onClick={() => handleAddMealItem(slot)}
                            className="col-span-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded py-1 transition"
                          >
                            + Add
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* SECTION 2: UPCOMING WEEK REGULAR MEAL PLANNER */}
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 space-y-5">
                <div>
                  <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                    📅 Upcoming Week Regular Plan
                  </h2>
                  <p className="text-xs text-slate-400">Pre-plan your upcoming week meal-by-meal as a standard template.</p>
                </div>

                {/* Day Selector */}
                <div className="flex flex-wrap gap-1.5">
                  {DAYS_OF_WEEK.map(day => (
                    <button
                      key={day}
                      onClick={() => setSelectedPlannerDay(day)}
                      className={`px-3 py-1.5 text-xs font-bold rounded-lg border transition ${selectedPlannerDay === day ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-900 text-slate-400 border-slate-700 hover:text-white'}`}
                    >
                      {day}
                    </button>
                  ))}
                </div>

                {/* Planned Meals Display for Selected Day */}
                <div className="bg-slate-900/90 border border-slate-700 rounded-xl p-4 space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h3 className="text-sm font-bold text-emerald-400">{selectedPlannerDay} Regular Schedule</h3>
                    <div className="text-xs text-slate-300 font-semibold">
                      Planned Totals: {(weeklyPlan[selectedPlannerDay] || []).reduce((a,c) => a + Number(c.cals||0), 0)} kcal | {(weeklyPlan[selectedPlannerDay] || []).reduce((a,c) => a + Number(c.protein||0), 0)}g Protein
                    </div>
                  </div>

                  {MEAL_SLOTS.map(slot => {
                    const plannerDayMeals = (weeklyPlan[selectedPlannerDay] || []).filter(m => m.slot === slot);
                    const slotInput = plannerInputs[slot] || { name: '', cals: '', protein: '' };

                    return (
                      <div key={slot} className="bg-slate-800/50 border border-slate-700/60 rounded-lg p-3 space-y-2">
                        <div className="text-[11px] font-bold text-slate-300 uppercase">{slot}</div>
                        
                        {plannerDayMeals.map(item => (
                          <div key={item.id} className="flex justify-between items-center bg-slate-900 px-2.5 py-1.5 rounded border border-slate-700 text-xs">
                            <span className="text-slate-200">{item.name}</span>
                            <div className="flex items-center gap-3">
                              <span className="text-amber-400 font-bold">{item.cals} kcal</span>
                              <span className="text-emerald-400 font-bold">{item.protein}g P</span>
                              <button onClick={() => removePlannerItem(item.id)} className="text-slate-500 hover:text-rose-400">✕</button>
                            </div>
                          </div>
                        ))}

                        <div className="grid grid-cols-12 gap-2 pt-1">
                          <input
                            type="text"
                            placeholder={`Plan item for ${slot}...`}
                            value={slotInput.name || ''}
                            onChange={(e) => setPlannerInputs({
                              ...plannerInputs,
                              [slot]: { ...slotInput, name: e.target.value }
                            })}
                            className="col-span-6 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white outline-none focus:border-emerald-500"
                          />
                          <input
                            type="number"
                            placeholder="kcal"
                            value={slotInput.cals || ''}
                            onChange={(e) => setPlannerInputs({
                              ...plannerInputs,
                              [slot]: { ...slotInput, cals: e.target.value }
                            })}
                            className="col-span-2 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white outline-none focus:border-emerald-500"
                          />
                          <input
                            type="number"
                            placeholder="g protein"
                            value={slotInput.protein || ''}
                            onChange={(e) => setPlannerInputs({
                              ...plannerInputs,
                              [slot]: { ...slotInput, protein: e.target.value }
                            })}
                            className="col-span-2 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white outline-none focus:border-emerald-500"
                          />
                          <button
                            onClick={() => handleAddPlannerItem(slot)}
                            className="col-span-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded py-1 transition"
                          >
                            + Plan
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* STEP TRACKER */}
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-white text-base">👟 Step Counter ({selectedDate})</h3>
                  <div className="text-xs font-bold text-sky-400">{totalSteps.toLocaleString()} / 10,000 steps</div>
                </div>

                <form onSubmit={handleAddSteps} className="flex gap-2">
                  <input
                    type="number"
                    placeholder="Enter step count..."
                    value={stepInput}
                    onChange={(e) => setStepInput(e.target.value)}
                    className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white outline-none flex-1 focus:border-sky-500"
                  />
                  <button type="submit" className="bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition">
                    + Log Walk
                  </button>
                </form>

                <div className="flex flex-wrap gap-2">
                  {currentStepSessions.map(s => (
                    <div key={s.id} className="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-2">
                      <span className="text-sky-300 font-bold">+{s.count.toLocaleString()}</span>
                      <span className="text-slate-500">({s.time})</span>
                      <button onClick={() => removeStepSession(s.id)} className="text-slate-500 hover:text-rose-400">✕</button>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          )}

          {/* TAB: WORKOUT SPLIT */}
          {activeTab === 'workout' && (
            <div className="space-y-6">
              <div className="flex justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <div className="flex gap-2">
                  {['Week 1', 'Week 2', 'Week 3', 'Week 4'].map(wk => (
                    <button
                      key={wk}
                      onClick={() => setSelectedWeek(wk)}
                      className={`px-3 py-1 text-xs font-semibold rounded-md transition ${selectedWeek === wk ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-slate-700 text-slate-300'}`}
                    >
                      {wk}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-5 gap-2">
                {['day1', 'day2', 'day3', 'day4', 'day5'].map((dKey, idx) => (
                  <button
                    key={dKey}
                    onClick={() => setSelectedDay(dKey)}
                    className={`p-2.5 rounded-xl border text-center transition ${selectedDay === dKey ? 'bg-slate-800 border-emerald-500 text-white' : 'bg-slate-900/60 border-slate-800 text-slate-400'}`}
                  >
                    <div className="text-xs font-bold">Day {idx + 1}</div>
                  </button>
                ))}
              </div>

              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 space-y-6">
                <div>
                  <div className="text-xs uppercase font-bold text-emerald-400">{selectedWeek} • {workoutLogs[selectedDay].focus}</div>
                  <h2 className="text-xl font-extrabold text-white">{workoutLogs[selectedDay].title}</h2>
                </div>

                <div className="space-y-6">
                  {workoutLogs[selectedDay].exercises.map((ex, exIdx) => (
                    <div key={exIdx} className="bg-slate-900/80 border border-slate-700/80 rounded-xl p-4 space-y-3">
                      <div className="flex justify-between items-start gap-2">
                        <div>
                          <h3 className="font-bold text-slate-100 text-sm">{exIdx + 1}. {ex.name}</h3>
                          <div className="text-xs text-emerald-300">💡 {ex.formCue}</div>
                        </div>
                        <span className="text-[11px] text-slate-400 bg-slate-800 px-2 py-1 rounded border border-slate-700">
                          {ex.target}
                        </span>
                      </div>

                      <div className="space-y-2 pt-2">
                        {ex.sets.map((set, sIdx) => (
                          <div key={sIdx} className="grid grid-cols-12 gap-2 items-center bg-slate-800/60 p-1.5 rounded-lg border border-slate-700/50">
                            <span className="col-span-2 text-xs font-bold text-slate-300">Set {sIdx + 1}</span>
                            <input
                              type="text"
                              value={set.weight}
                              onChange={(e) => handleSetChange(selectedDay, exIdx, sIdx, 'weight', e.target.value)}
                              placeholder="kg"
                              className="col-span-4 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white"
                            />
                            <input
                              type="text"
                              value={set.reps}
                              onChange={(e) => handleSetChange(selectedDay, exIdx, sIdx, 'reps', e.target.value)}
                              placeholder="reps"
                              className="col-span-4 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white"
                            />
                            <button onClick={() => removeSet(selectedDay, exIdx, sIdx)} className="col-span-2 text-slate-500 hover:text-rose-400 text-xs">✕</button>
                          </div>
                        ))}
                        <button onClick={() => addSet(selectedDay, exIdx)} className="text-xs text-emerald-400 font-semibold">+ Add Set</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TAB: PROGRESS */}
          {activeTab === 'progress' && (
            <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 text-center space-y-4">
              <h2 className="text-2xl font-extrabold text-white">100-Day Gym Goal</h2>
              <div className="text-emerald-400 font-bold text-3xl">Day {gymDays} / 100</div>
              <div className="w-full bg-slate-900 border border-slate-700 h-6 rounded-full overflow-hidden p-1">
                <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${Math.min((gymDays / 100) * 100, 100)}%` }}></div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
